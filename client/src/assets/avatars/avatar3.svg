  <circle cx="36" cy="36" r="11" fill="#18181B"/>
  <circle cx="36" cy="36" r="6" fill="#3F3F46"/>
  <circle cx="84" cy="36" r="11" fill="#18181B"/>
  <circle cx="84" cy="36" r="6" fill="#3F3F46"/>

  <!-- Panda Body / Hoodie -->
  <path d="M34 110 C34 88 44 80 60 80 C76 80 86 88 86 110 Z" fill="#6366F1"/>
  <path d="M52 80 L68 80 L65 110 L55 110 Z" fill="#4F46E5"/>

  <!-- Panda Head -->
  <ellipse cx="60" cy="56" rx="28" ry="25" fill="#FFFFFF"/>

  <!-- Headphone Ear Cushions -->
  <rect x="22" y="44" width="9" height="18" rx="4.5" fill="#4F46E5" stroke="#818CF8" stroke-width="1.5"/>
  <rect x="89" y="44" width="9" height="18" rx="4.5" fill="#4F46E5" stroke="#818CF8" stroke-width="1.5"/>

  <!-- Panda Eye Patches -->
  <ellipse cx="48" cy="53" rx="7.5" ry="9" fill="#18181B" transform="rotate(-15 48 53)"/>
  <ellipse cx="72" cy="53" rx="7.5" ry="9" fill="#18181B" transform="rotate(15 72 53)"/>

  <!-- Eyes -->
  <circle cx="49" cy="52" r="2.5" fill="#FFFFFF"/>
  <circle cx="50" cy="51" r="1" fill="#18181B"/>
  <circle cx="71" cy="52" r="2.5" fill="#FFFFFF"/>
  <circle cx="70" cy="51" r="1" fill="#18181B"/>

  <!-- Round Geek Glasses -->
  <circle cx="48" cy="53" r="11" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
  <circle cx="72" cy="53" r="11" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
  <line x1="59" y1="52" x2="61" y2="52" stroke="#F59E0B" stroke-width="2.2"/>

  <!-- Panda Nose & Cute Mouth -->
